name: Publicar Novena no GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar imagens nítidas\n        run: |\n          rm -rf assets/img\n          unzip -oq hildegarda-images-v7.zip -d .\n\n      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
