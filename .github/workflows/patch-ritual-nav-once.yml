name: Patch ritual navigation once

# trigger: 2026-09-13
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable direct ritual-step navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app_path = Path('medieval/app.js')
          css_path = Path('medieval/styles.css')
          index_path = Path('medieval/index.html')
          sw_path = Path('medieval/sw.js')

          app = app_path.read_text(encoding='utf-8')
          marker = 'function openRitualFromStepControl(step)'
          if marker not in app:
              needle = 'document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));'
              assert needle in app, 'navigation insertion point not found'
              addition = r'''
function openRitualFromStepControl(step){
  const r=activeRitual();
  const day=r?.day||selected||currentDay();
  const s=load();
  const review=r?.review??s.done.includes(day);
  openRitualStep(step,day,review);
}
document.querySelectorAll("[data-ritual-step]").forEach(el=>{
  el.setAttribute("role","button");
  el.tabIndex=0;
  el.setAttribute("aria-label",el.textContent.trim());
  const open=()=>openRitualFromStepControl(el.dataset.ritualStep);
  el.addEventListener("click",open);
  el.addEventListener("keydown",e=>{
    if(e.key==="Enter"||e.key===" "){
      e.preventDefault();
      open();
    }
  });
});
'''
              app = app.replace(needle, needle + addition)

          app = app.replace('./sw.js?v=24','./sw.js?v=25')
          app_path.write_text(app, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          css_marker = '/* v25 — etapas da oração navegáveis */'
          if css_marker not in css:
              css += r'''

/* v25 — etapas da oração navegáveis */
.ritual-step[role="button"]{
  cursor:pointer;
  user-select:none;
  touch-action:manipulation;
  transition:transform .14s ease, box-shadow .14s ease, border-color .14s ease;
}
.ritual-step[role="button"]:active{
  transform:translateY(1px) scale(.99);
}
.ritual-step[role="button"]:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:3px;
}
@media(hover:hover){
  .ritual-step[role="button"]:hover{
    border-color:rgba(184,138,42,.72);
    box-shadow:0 3px 10px rgba(73,54,20,.09);
  }
}
'''
          css_path.write_text(css, encoding='utf-8')

          index = index_path.read_text(encoding='utf-8')
          index = index.replace('styles.css?v=24','styles.css?v=25').replace('app.js?v=24','app.js?v=25')
          index_path.write_text(index, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace('hildegarda-medieval-v24','hildegarda-medieval-v25')
          sw = sw.replace('styles.css?v=24','styles.css?v=25').replace('app.js?v=24','app.js?v=25')
          sw_path.write_text(sw, encoding='utf-8')
          PY

          node --check medieval/app.js
          grep -q 'function openRitualFromStepControl(step)' medieval/app.js
          grep -q 'hildegarda-medieval-v25' medieval/sw.js

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- medieval/app.js medieval/styles.css medieval/index.html medieval/sw.js; then
            echo "Patch already applied; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medieval/app.js medieval/styles.css medieval/index.html medieval/sw.js
          git commit -m "Permitir navegação direta entre etapas da oração"
          git push
