name: Patch navegação da jornada
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/journey-return-patch.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Aplicar navegação Jornada ↔ Dia
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          idx=Path('medieval/index.html')
          app=Path('medieval/app.js')
          sw=Path('medieval/sw.js')

          h=idx.read_text(encoding='utf-8')
          a=app.read_text(encoding='utf-8')
          s=sw.read_text(encoding='utf-8')

          marker='/* v26 — retorno direto entre Jornada e dia escolhido */'
          css='''\n%s\n.journey-return{\n  display:inline-flex;align-items:center;gap:6px;margin:8px 0 10px;\n  border:1px solid rgba(184,138,42,.48);border-radius:999px;\n  background:rgba(255,248,226,.82);color:var(--green);\n  padding:7px 11px;font:700 .72rem Inter,sans-serif;cursor:pointer;\n  box-shadow:0 2px 8px rgba(72,53,19,.05);\n}\n.journey-return:active{transform:translateY(1px)}\n.journey-return:focus-visible{outline:2px solid var(--gold);outline-offset:2px}\n@media(hover:hover){.journey-return:hover{border-color:rgba(13,74,49,.48);background:rgba(238,239,215,.9)}}\n''' % marker
          if marker not in h:
              h=h.replace('</style>',css+'\n</style>',1)

          btn='<button type="button" class="journey-return" id="backToJourney">← Minha jornada</button>\n      '
          anchor='<div class="page-toolbar">'
          if 'id="backToJourney"' not in h:
              h=h.replace(anchor,btn+anchor,1)

          # Amplia o script v25 sem tocar na lógica principal do app.
          hook='''  document.querySelectorAll("[data-ritual-step]").forEach(el=>{'''
          addition='''  const journeyLabels={pt:"← Minha jornada",en:"← My journey",de:"← Meine Gebetsreise",es:"← Mi camino"};\n  const backToJourney=document.getElementById("backToJourney");\n  function updateJourneyReturnLabel(){\n    if(!backToJourney)return;\n    const lang=(document.documentElement.lang||"pt").slice(0,2);\n    backToJourney.textContent=journeyLabels[lang]||journeyLabels.pt;\n    backToJourney.setAttribute("aria-label",backToJourney.textContent.replace("← ",""));\n  }\n  if(backToJourney){\n    backToJourney.addEventListener("click",()=>{if(typeof go==="function")go("journey")});\n    updateJourneyReturnLabel();\n    new MutationObserver(updateJourneyReturnLabel).observe(document.documentElement,{attributes:true,attributeFilter:["lang"]});\n  }\n\n'''
          if 'const journeyLabels=' not in h:
              h=h.replace(hook,addition+hook,1)

          # Garante cache renovado para instalações PWA.
          h=h.replace('./app.js?v=24','./app.js?v=26')
          a=a.replace('./sw.js?v=24','./sw.js?v=26')
          s=s.replace('hildegarda-medieval-v24','hildegarda-medieval-v26')
          s=s.replace('./app.js?v=24','./app.js?v=26')

          idx.write_text(h,encoding='utf-8')
          app.write_text(a,encoding='utf-8')
          sw.write_text(s,encoding='utf-8')

          assert 'id="backToJourney"' in h
          assert 'const journeyLabels=' in h
          assert './app.js?v=26' in h
          assert './sw.js?v=26' in a
          assert 'hildegarda-medieval-v26' in s
          PY

      - name: Remover workflow temporário e registrar atualização
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/journey-return-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medieval/index.html medieval/app.js medieval/sw.js .github/workflows/journey-return-patch.yml
          git commit -m "Permitir retorno da oração para Minha Jornada"
          git push origin main

      - name: Preparar imagens clássicas individuais
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          UA="Mozilla/5.0 (compatible; NovenaHildegarda/1.0)"
          getimg() { curl --fail --location --retry 3 --retry-delay 2 -A "$UA" "$1" -o "$2"; test -s "$2"; }
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Hildegard%20von%20Bingen.jpg?width=1200" "assets/img/hero.jpg"
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Liber%20scivias%20domini%20fig%2001.jpg?width=1000" "assets/img/day1.jpg"
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Scivias%2C%20Cod.%20Sal.%20X%2C16%2C%20p.%204.jpg?width=1000" "assets/img/day2.jpg"
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Hildegard%20von%20Bingen%20Liber%20Divinorum%20Operum.jpg?width=1200" "assets/img/day3.jpg"
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/St.%20Hildegard%20von%20Bingen%20receiving%20divine%20inspiration%20and%20writing%2C%20Lucca%20codex%2C%20Liber%20Divinorum%20Operum%20%281163-1173%29%2C%20detail.jpg?width=1000" "assets/img/day4.jpg"
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/Meister%20des%20Hildegardis-Codex%20001.jpg?width=1200" "assets/img/day5.jpg"
          cp assets/img/day3.jpg assets/img/day6.jpg
          cp assets/img/day2.jpg assets/img/day7.jpg
          getimg "https://commons.wikimedia.org/wiki/Special:Redirect/file/St.%20Hildegard%20von%20Bingen%2C%20The%20Salem%20Scivias%20%281200%29%2C%20detail.jpg?width=1000" "assets/img/day8.jpg"
          cp assets/img/hero.jpg assets/img/day9.jpg

      - name: Gerar card e ícones
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rsvg-convert >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y librsvg2-bin; fi
          rsvg-convert -w 1200 -h 630 share-card.svg -o share-card.png
          python3 -m pip install --quiet pillow
          python3 medieval/build_share_card.py
          python3 medieval/build_pwa_icons.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
