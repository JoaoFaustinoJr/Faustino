name: Hildegarda ritual pages v28

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.hildegarda-v28-trigger'

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar reorganizacao
        run: python scripts/reorganize_hildegarda_v28.py

      - name: Commit
        run: |
          if git diff --quiet -- medieval/index.html medieval/app.js; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add medieval/index.html medieval/app.js
          git commit -m "Separa oracoes inicial e final em paginas proprias"
          git push
