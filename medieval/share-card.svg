<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fff7dc"/><stop offset=".55" stop-color="#f7e8bf"/><stop offset="1" stop-color="#ecd59b"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0f5a3a"/><stop offset="1" stop-color="#083c29"/>
  </linearGradient>
  <clipPath id="heroClip"><rect x="48" y="78" width="310" height="430" rx="40"/></clipPath>
  <clipPath id="screenClip"><rect x="932" y="108" width="205" height="390" rx="30"/></clipPath>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".22"/></filter>
</defs>

<rect width="1200" height="630" fill="url(#paper)"/>
<rect x="10" y="10" width="1180" height="610" rx="22" fill="none" stroke="#b98b2f" stroke-width="5"/>
<rect x="20" y="20" width="1160" height="590" rx="18" fill="none" stroke="#164c34" stroke-width="2"/>

<!-- illuminated corners -->
<g fill="none" stroke-linecap="round">
  <path d="M26 100 C65 45 115 40 170 52 C125 57 103 80 91 119 C77 91 58 82 26 100Z" stroke="#1a5d3b" stroke-width="8"/>
  <path d="M1174 100 C1135 45 1085 40 1030 52 C1075 57 1097 80 1109 119 C1123 91 1142 82 1174 100Z" stroke="#1a5d3b" stroke-width="8"/>
  <path d="M26 535 C72 587 126 591 177 574 C128 571 102 549 91 511 C75 540 56 549 26 535Z" stroke="#1a5d3b" stroke-width="8"/>
  <path d="M1174 535 C1128 587 1074 591 1023 574 C1072 571 1098 549 1109 511 C1125 540 1144 549 1174 535Z" stroke="#1a5d3b" stroke-width="8"/>
  <path d="M32 92 C74 72 105 75 129 97" stroke="#d2aa49" stroke-width="4"/>
  <path d="M1168 92 C1126 72 1095 75 1071 97" stroke="#d2aa49" stroke-width="4"/>
</g>

<!-- Saint panel -->
<rect x="38" y="68" width="330" height="450" rx="48" fill="#0f4a32" stroke="#b88a2a" stroke-width="6" filter="url(#shadow)"/>
<image href="../assets/img/hero.jpg" x="48" y="78" width="310" height="430" preserveAspectRatio="xMidYMid slice" clip-path="url(#heroClip)"/>
<rect x="53" y="432" width="300" height="72" rx="18" fill="#fbefcd" fill-opacity=".94" stroke="#b88a2a" stroke-width="2"/>
<text x="203" y="461" text-anchor="middle" font-family="Georgia,serif" font-size="25" font-weight="700" fill="#123f2b">SANTA HILDEGARDA</text>
<text x="203" y="488" text-anchor="middle" font-family="Georgia,serif" font-size="19" font-style="italic" fill="#5e472a">Virgem e Doutora da Igreja</text>

<!-- header -->
<text x="635" y="48" text-anchor="middle" font-family="Georgia,serif" font-size="16" letter-spacing="4" fill="#284c34">FÉ  ✦  SABEDORIA  ✦  CURA  ✦  VIDA PLENA EM DEUS</text>
<text x="635" y="104" text-anchor="middle" font-family="Georgia,serif" font-size="37" font-weight="700" fill="#183f2d">NOVENA DIGITAL DE</text>
<text x="635" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="70" font-weight="700" fill="#0c3f2a">SANTA HILDEGARDA</text>
<text x="635" y="214" text-anchor="middle" font-family="Georgia,serif" font-size="41" font-weight="700" fill="#0c3f2a">DE BINGEN</text>
<text x="635" y="251" text-anchor="middle" font-family="Georgia,serif" font-size="27" font-style="italic" fill="#694c2a">Virgem e Doutora da Igreja</text>
<line x1="408" y1="270" x2="860" y2="270" stroke="#b88a2a" stroke-width="2"/>
<text x="635" y="311" text-anchor="middle" font-family="Georgia,serif" font-size="30" font-style="italic" fill="#2f332d">9 dias de oração, reflexão, intenção e música.</text>

<!-- feature chips -->
<g font-family="Arial,sans-serif">
  <g transform="translate(410 340)">
    <rect width="135" height="70" rx="16" fill="url(#green)" stroke="#c59d43" stroke-width="3"/>
    <circle cx="68" cy="16" r="17" fill="#f2d77f"/><text x="68" y="22" text-anchor="middle" font-size="18" fill="#0d4a31">▯</text>
    <text x="68" y="51" text-anchor="middle" font-size="15" font-weight="700" fill="#fff7df">INSTALÁVEL</text>
  </g>
  <g transform="translate(560 340)">
    <rect width="145" height="70" rx="16" fill="url(#green)" stroke="#c59d43" stroke-width="3"/>
    <circle cx="73" cy="16" r="17" fill="#f2d77f"/><text x="73" y="22" text-anchor="middle" font-size="19" fill="#0d4a31">▤</text>
    <text x="73" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#fff7df">LIVRO DEVOCIONAL</text>
  </g>
  <g transform="translate(720 340)">
    <rect width="155" height="70" rx="16" fill="url(#green)" stroke="#c59d43" stroke-width="3"/>
    <circle cx="78" cy="16" r="17" fill="#f2d77f"/><text x="78" y="22" text-anchor="middle" font-size="19" fill="#0d4a31">↔</text>
    <text x="78" y="47" text-anchor="middle" font-size="13" font-weight="700" fill="#fff7df">FORMATO DE LIVRO</text>
  </g>
</g>

<text x="642" y="438" text-anchor="middle" font-family="Georgia,serif" font-size="23" font-style="italic" fill="#664e2c">Deslize como as páginas de um livro.</text>

<!-- CTA -->
<rect x="430" y="466" width="425" height="66" rx="22" fill="url(#green)" stroke="#c99e3d" stroke-width="4" filter="url(#shadow)"/>
<text x="642" y="508" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#fff2ca">📖  Abrir a novena  ›</text>

<!-- phone -->
<rect x="910" y="80" width="250" height="454" rx="46" fill="#11171a" stroke="#b88a2a" stroke-width="5" filter="url(#shadow)"/>
<rect x="922" y="92" width="226" height="430" rx="36" fill="#f8edcb"/>
<image href="../assets/img/day1.jpg" x="932" y="108" width="205" height="390" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)"/>
<rect x="937" y="113" width="195" height="61" rx="14" fill="#fbefd0" fill-opacity=".95"/>
<text x="1034" y="135" text-anchor="middle" font-family="Georgia,serif" font-size="14" font-weight="700" fill="#153e2b">1º DIA</text>
<text x="1034" y="158" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" fill="#153e2b">A SABEDORIA DE DEUS</text>
<rect x="943" y="449" width="181" height="38" rx="16" fill="#0d4a31" stroke="#b88a2a" stroke-width="2"/>
<text x="1034" y="474" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#fff5d9">Iniciar oração de hoje ›</text>

<!-- footer -->
<rect x="392" y="548" width="664" height="50" rx="15" fill="#fbefcd" stroke="#b88a2a" stroke-width="2"/>
<text x="724" y="579" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#123f2b">joaofaustinojr.github.io/Faustino/medieval/</text>
<text x="40" y="578" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#604727">“Que a Sabedoria divina guie a sua jornada.”</text>
<text x="600" y="616" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#173f2b">Santa Hildegarda de Bingen, rogai por nós!</text>
</svg>